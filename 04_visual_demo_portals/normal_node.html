  <script>
    const STAGES = [
      { title: "1. OTAA Node Activation", speech: "\"The device lifecycle initiates with Over-The-Air Activation (OTAA). The sensor sends a Join-Request with a unique DevNonce, and the Join Server derives two separate session keys: NwkSKey for network integrity and AppSKey for end-to-end payload encryption.\"", point: "Key separation ensures gateways forward packets without ever decrypting user data." },
      { title: "2. Established Healthy Baseline", speech: "\"During normal operation, the stateful engine profiles the fleet's normal behavior. Dev_001 has sent 1,041 steady uplinks at 15-second intervals with +8.5 dB SNR and 0.34% airtime duty cycle.\"", point: "Establishing a per-device baseline allows us to detect sudden behavioral shifts later." },
      { title: "3. Packet Birth & Frame Structure", speech: "\"The sensor constructs uplink #1042. Notice the frame structure: DevAddr and FCnt are visible in the MAC header, while the 16-byte sensor payload stays AES-128 encrypted.\"", point: "Our monitor inspects plaintext MAC headers & PHY radio metrics—never breaking AES." },
      { title: "4. Sub-GHz Pure ALOHA Channel", speech: "\"The modulated chirp frame propagates across the 865.0625 MHz radio channel using Chirp Spread Spectrum (SF7). Because LoRaWAN uses uncoordinated Pure ALOHA without carrier sensing, staying at 0.34% duty cycle keeps channel load low (G = 0.06) with zero collisions.\"", point: "Regional 1% duty-cycle compliance stabilizes Pure ALOHA throughput (S = G·e^-2G)." },

      { title: "6. IP Backhaul & Dual Monitor Tap", speech: "\"Gateways forward frames over IP backhaul into two parallel taps: two points: raw UDP Port 9999 for unfiltered radio/TDoA metadata, and ChirpStack MQTT Port 1883 for deduplicated, MIC-verified session context.\"", point: "Correlating UDP + MQTT eliminates blind spots between RF reception and server filtering." },
      { title: "7. Layer 1 M/M/1 Queue & State", speech: "\"In Layer 1, the non-blocking M/M/1 queue runs at 14.2% utilization (ρ = 0.142) with zero drops. The state tracker computes Δt = 15.02s and ΔFCnt = +1, confirming normal cadence.\"", point: "Service rate μ = 847 pkts/s easily absorbs bursts without socket ring-buffer loss." },
      { title: "8. Layer 2 Inside the ML Algorithms", speech: "\"Layer 2 evaluates the 7-D feature vector into two algorithms in 1.18 ms: XGBoost (140 gradient-boosted trees) scores it at 0.4% threat probability, and Isolation Forest confirms a deep inlier path (+0.18).\"", point: "Dual ML architecture covers both known attack patterns and novel outliers." },
      { title: "9. Layer 3 7-Rule Decision Flowchart", speech: "\"In Layer 3, the event passes through 7 deterministic protocol checks—Session ID, Monotonic FCnt, Duty Cycle, SNR, ADR, Frequency, and TDoA Spatial Bound. All 7 checks pass.\"", point: "Every verdict maps directly to verifiable network rules rather than black-box scores." },
      { title: "10. Audit Log & Application Delivery", speech: "\"The cleared event is committed to SQLite WAL and delivered to the Application Server. Zero downlink commands are sent, preserving the Class A sensor's battery life.\"", point: "Complete normal lifecycle verified. Switch to the Rogue Node Lifecycle portal to inspect adversarial deviations." }
    ];

    let currentStep = 1;
    let playTimer = null;

    function updateUI(scroll = true) {
      document.getElementById('stepCounter').textContent = currentStep;
      document.getElementById('narratorBadge').textContent = `Stage ${currentStep} / 10`;
      document.getElementById('narratorTitle').textContent = STAGES[currentStep - 1].title;
      document.getElementById('narratorSpeech').textContent = STAGES[currentStep - 1].speech;
      document.getElementById('narratorPoint').textContent = STAGES[currentStep - 1].point;

      document.getElementById('btnPrev').disabled = currentStep === 1;
      document.getElementById('btnNext').disabled = currentStep === 10;

      for (let i = 1; i <= 10; i++) {
        const tier = document.getElementById(`tier-${i}`);
        tier.classList.remove('active', 'visited');
        if (i === currentStep) tier.classList.add('active');
        else if (i < currentStep) tier.classList.add('visited');
      }

      document.getElementById('stepDots').innerHTML = Array.from({ length: 10 }, (_, i) => {
        const s = i + 1;
        return `<button onclick="goToStep(${s})" class="w-2 h-2 rounded-full transition ${s === currentStep ? 'bg-emerald-400 scale-125' : (s < currentStep ? 'bg-emerald-500/40' : 'bg-slate-700')}"></button>`;
      }).join('');

      if (scroll) {
        document.getElementById(`tier-${currentStep}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function nextStep() {
      if (currentStep < 10) { currentStep++; updateUI(true); }
      else if (playTimer) togglePlay();
    }
    function prevStep() { if (currentStep > 1) { currentStep--; updateUI(true); } }
    function goToStep(s) { currentStep = s; updateUI(true); }
    function resetFlow() { if (playTimer) togglePlay(); currentStep = 1; updateUI(true); }
    function togglePlay() {
      const btn = document.getElementById('btnPlay');
      if (playTimer) {
        clearInterval(playTimer); playTimer = null;
        btn.textContent = '▶ Play Auto';
        btn.classList.replace('bg-amber-400', 'bg-emerald-500');
      } else {
        if (currentStep === 10) currentStep = 1;
        updateUI(true);
        btn.textContent = '⏸ Pause';
        btn.classList.replace('bg-emerald-500', 'bg-amber-400');
        playTimer = setInterval(nextStep, 3400);
      }
    }
    updateUI(false);
  </script>
