          { title: "9. Layer 3 7-Rule Decision Flowchart", speech: "\"Protocol checks 1 through 6 pass; Check #7 (TDoA Spatial Bound) is the exact rule that turns red and catches the proxy relay.\"", point: "Proves the necessity of our 7-layer cascade." },
          { title: "10. Session Revocation & Quarantine", speech: "\"Layer 3 revokes the compromised session and drops Sybil_Node at the gateway firewall without touching encryption keys.\"", point: "LORA_MAC_REVOKE_SESSION --dev-eui Sybil_Node --reason TDOA_VIOLATION" }
        ]
      },
      jamming: {
        s3Desc: "An active RF jammer injects broadband noise on 865.0625 MHz to drown out legitimate sensor uplinks.",
        s3Node: "⚠️ Jammer_01",
        s3Mode: "RF Barrage Noise Flood",
        s3Fcnt: "150 (Corrupted)",
        s3Cadence: "Continuous Noise",
        s3CadSub: "98% Channel Occupancy",
        s4Desc: "Driving SNR down to -12.0 dB collapses Shannon channel capacity C = B·log₂(1 + SNR) below the receiver's demodulation threshold.",
        s4Rf: "-122 dBm / -12 dB (!)",
        s4Duty: "98.0% (Jamming)",
        s4Aloha: "SNR Collapse (< -8dB)",
        s4X: "✖ DEMODULATOR SATURATION",
        s5Gwa1: "SNR Collapse: -12.0 dB",
        s5Gwa2: "RSSI: -122.0 dBm",
        s5Tdoa: "Gateway B: Packet Lost",
        s5Var: "Asymmetric Link Outage",
        s5Alert: true,
        s7Iat: "Δt = 0.0800 s",
        s7Fcnt: "SNR Drift: -20.5 dB (!)",
        s7Vec: "[-122.0, -12.0, SF7, 0.08s,",
        s8XgbSub: "Tree Split Triggered: SNR < -8.0 dB",
        s8Xgb: "Threat Probability: 94.8% (HIGH)",
        s8Iso: "Anomaly Score: -0.38 (OUTLIER)",
        failedRuleIdx: 3,
        s9Verdict: "✖ RULE #4 FAILED → CHANNEL HOP",
        s10Db: "Channel 865.06 Excluded",
        s10Fw1: "LinkADRReq (CID 0x03)",
        s10Fw2: "Shift Honest Nodes to SF12",
        stages: [
          { title: "1. Initial OTAA Onboarding", speech: "\"Legitimate sensors are active on the 865.0625 MHz sub-band after OTAA activation.\"", point: "Sets up physical-layer denial-of-service scenario." },
          { title: "2. Normal Baseline Phase", speech: "\"Under healthy conditions, gateways receive uplinks at +8.0 dB SNR with clean demodulation.\"", point: "Baseline link margin established." },
          { title: "3. Behavioral Shift: RF Jammer Activated", speech: "\"At Stage 3, Jammer_01 floods the 865.0625 MHz carrier with continuous noise to block sensor uplinks.\"", point: "Physical layer attack targeting receiver sensitivity." },
          { title: "4. Shannon-Hartley Capacity Collapse", speech: "\"The red ✖ marker shows Demodulator Saturation. SNR plunges to -12.0 dB, collapsing Shannon channel capacity C = B·log₂(1 + SNR) so frames fail demodulation.\"", point: "Direct application of Shannon's noisy-channel capacity limit." },
          { title: "5. Asymmetric Multi-Gateway Outage", speech: "\"Gateway B loses the packet completely while Gateway A logs -122 dBm RSSI and -12 dB SNR.\"", point: "Asymmetric reception drop pinpoints localized RF interference." },
          { title: "6. Raw Concentrator Telemetry via UDP :9999", speech: "\"UDP :9999 captures the degraded radio noise-floor metrics directly from Gateway A's concentrator.\"", point: "Real-time visibility into physical radio health." },
          { title: "7. Layer 1 RF Drift Calculation", speech: "\"Layer 1 compares incoming -12.0 dB SNR against the +8.5 dB baseline, registering a 20.5 dB sudden drop.\"", point: "Tracks both timing state and radio link quality." },
          { title: "8. Layer 2 Inside the ML Algorithms", speech: "\"XGBoost and Isolation Forest score the RF anomaly at 94.8% High severity in 1.18 ms.\"", point: "Rapid physical anomaly detection." },
          { title: "9. Layer 3 7-Rule Decision Flowchart", speech: "\"Check #4 (SNR/RSSI Baseline) turns red, diagnosing active RF Jamming rather than normal packet collision.\"", point: "Clear root-cause separation between collisions and jamming." },
          { title: "10. Adaptive Channel Hopping (LinkADRReq)", speech: "\"Instead of just dropping packets, Layer 3 excludes the jammed channel and issues a standard LoRaWAN LinkADRReq (CID 0x03) command to shift honest nodes to higher Spreading Factor / clean frequencies.\"", point: "LinkADRReq (CID 0x03) --target-sf 12 --channel-exclude 865.0625MHz" }
        ]
      }
    };

    const RULES = [
      "1. Session",
      "2. FCnt (+1)",
      "3. Duty ≤1%",
      "4. SNR/RSSI",
      "5. SF / ADR",
      "6. IN865 Ch",
      "7. TDoA Bound"
    ];

    let currentMode = 'dos';
    let currentStep = 1;
    let playTimer = null;

    function renderRules(failedIdx) {
      const container = document.getElementById('s9-grid');
      container.innerHTML = RULES.map((r, idx) => {
        const x = idx * 111;
        const w = idx === 6 ? 104 : 102;
        if (idx === failedIdx) {
          return `<g transform="translate(${x}, 0)">
            <rect x="0" y="0" width="${w}" height="58" rx="8" fill="#2b0c16" stroke="#f43f5e" stroke-width="2"/>
            <text x="${w/2}" y="24" fill="#ffffff" font-weight="700">${r}</text>
            <text x="${w/2}" y="42" fill="#f43f5e" font-weight="800">✖ FAIL</text>
          </g>`;
        }
        return `<g transform="translate(${x}, 0)">
          <rect x="0" y="0" width="${w}" height="58" rx="8" fill="#0d2620" stroke="#10b981" opacity="0.75"/>
          <text x="${w/2}" y="24" fill="#e2e8f0">${r}</text>
          <text x="${w/2}" y="42" fill="#10b981" font-weight="700">✔ PASS</text>
        </g>`;
      }).join('');
    }

    function applyScenario() {
      currentMode = document.getElementById('attackSelector').value;
      const s = SCENARIOS[currentMode];

      document.getElementById('s3-desc').textContent = s.s3Desc;
      document.getElementById('s3-node').textContent = s.s3Node;
      document.getElementById('s3-mode').textContent = s.s3Mode;
      document.getElementById('s3-fcnt').textContent = s.s3Fcnt;
      document.getElementById('s3-cadence').textContent = s.s3Cadence;
      document.getElementById('s3-cadsub').textContent = s.s3CadSub;

      document.getElementById('s4-desc').textContent = s.s4Desc;
      document.getElementById('s4-rf').textContent = s.s4Rf;
      document.getElementById('s4-duty').textContent = s.s4Duty;
      document.getElementById('s4-aloha').textContent = s.s4Aloha;
      document.getElementById('s4-x').textContent = s.s4X;

      document.getElementById('s5-gwa1').textContent = s.s5Gwa1;
      document.getElementById('s5-gwa2').textContent = s.s5Gwa2;
      document.getElementById('s5-tdoa').textContent = s.s5Tdoa;
      document.getElementById('s5-var').textContent = s.s5Var;
      const s5Box = document.getElementById('s5-box');
      if (s.s5Alert) {
        s5Box.setAttribute('fill', '#2b0c16');
        s5Box.setAttribute('stroke', '#f43f5e');
        document.getElementById('s5-tdoa').setAttribute('fill', '#f43f5e');
        document.getElementById('s5-var').setAttribute('fill', '#fda4af');
      } else {
        s5Box.setAttribute('fill', '#0d1629');
        s5Box.setAttribute('stroke', '#3b82f6');
        document.getElementById('s5-tdoa').setAttribute('fill', '#ffffff');
        document.getElementById('s5-var').setAttribute('fill', '#10b981');
      }

      document.getElementById('s7-iat').textContent = s.s7Iat;
      document.getElementById('s7-fcnt').textContent = s.s7Fcnt;
      document.getElementById('s7-vec').textContent = s.s7Vec;

      document.getElementById('s8-xgb-sub').textContent = s.s8XgbSub;
      document.getElementById('s8-xgb').textContent = s.s8Xgb;
      document.getElementById('s8-iso').textContent = s.s8Iso;

      renderRules(s.failedRuleIdx);
      document.getElementById('s9-verdict').textContent = s.s9Verdict;

      document.getElementById('s10-db').textContent = s.s10Db;
      document.getElementById('s10-fw1').textContent = s.s10Fw1;
      document.getElementById('s10-fw2').textContent = s.s10Fw2;

      updateUI(false);
    }

    function updateUI(scroll = true) {
      const stageObj = SCENARIOS[currentMode].stages[currentStep - 1];
      document.getElementById('stepCounter').textContent = currentStep;
      document.getElementById('narratorBadge').textContent = `Stage ${currentStep} / 10`;
      document.getElementById('narratorTitle').textContent = stageObj.title;
      document.getElementById('narratorSpeech').textContent = stageObj.speech;
      document.getElementById('narratorPoint').textContent = stageObj.point;

      document.getElementById('btnPrev').disabled = currentStep === 1;
      document.getElementById('btnNext').disabled = currentStep === 10;

      for (let i = 1; i <= 10; i++) {
        const tier = document.getElementById(`tier-${i}`);
        tier.classList.remove('active', 'active-green', 'visited');
        if (i === currentStep) {
          tier.classList.add(i <= 2 ? 'active-green' : 'active');
        } else if (i < currentStep) {
          tier.classList.add('visited');
        }
      }

      document.getElementById('stepDots').innerHTML = Array.from({ length: 10 }, (_, i) => {
        const s = i + 1;
        const activeColor = s <= 2 ? 'bg-emerald-400' : 'bg-rose-500';
        return `<button onclick="goToStep(${s})" class="w-2 h-2 rounded-full transition ${s === currentStep ? activeColor + ' scale-125' : (s < currentStep ? 'bg-rose-500/40' : 'bg-slate-700')}"></button>`;
      }).join('');

      if (scroll) {
        document.getElementById(`tier-${currentStep}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function nextStep() {
      if (currentStep < 10) { currentStep++; updateUI(true); }
      else if (playTimer) togglePlay();
    }
    function prevStep() { if (currentStep > 1) { currentStep--; updateUI(true); } }
    function goToStep(s) { currentStep = s; updateUI(true); }
    function resetFlow() { if (playTimer) togglePlay(); currentStep = 1; updateUI(true); }
    function togglePlay() {
      const btn = document.getElementById('btnPlay');
      if (playTimer) {
        clearInterval(playTimer); playTimer = null;
        btn.textContent = '▶ Play Auto';
        btn.classList.replace('bg-amber-400', 'bg-rose-500');
      } else {
        if (currentStep === 10) currentStep = 1;
        updateUI(true);
        btn.textContent = '⏸ Pause';
        btn.classList.replace('bg-rose-500', 'bg-amber-400');
        playTimer = setInterval(nextStep, 3500);
      }
    }

    applyScenario();
  </script>
</body>
